<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código QR Oficial | Micho Burguer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --accent: #ffb300;
            --dark: #1f2937;
            --light-bg: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f1f5f9;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Panel de Control Superior (se oculta al imprimir) */
        .controls-panel {
            background: #ffffff;
            border-radius: 16px;
            padding: 1.2rem 1.6rem;
            max-width: 520px;
            width: 100%;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .controls-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }

        .url-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            text-align: left;
            margin-bottom: 1rem;
        }

        .url-input-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #475569;
        }

        .url-input-group input {
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            border: 1.5px solid #cbd5e1;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--dark);
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input-group input:focus {
            border-color: var(--primary);
        }

        .actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn-print {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        .btn-print:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-download {
            background: #ffffff;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-download:hover {
            background: #ffebee;
        }

        .btn-back {
            grid-column: span 2;
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            color: #475569;
            text-decoration: none;
            font-size: 0.82rem;
            padding: 0.55rem;
        }

        .btn-back:hover {
            background: #f1f5f9;
        }

        /* Tarjeta de Mesa / Mostrador Oficial (Lista para imprimir o exhibir) */
        .qr-card-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 3px solid #ffb300;
            text-align: center;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .qr-card-header {
            background: linear-gradient(135deg, #ffca28 0%, #ffb300 100%);
            padding: 1.6rem 1.4rem 1.2rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-card-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffffff;
            padding: 4px;
            border: 3px solid var(--primary);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            margin-bottom: 0.6rem;
            object-fit: contain;
        }

        .qr-brand-title {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .qr-brand-subtitle {
            font-size: 0.78rem;
            font-weight: 800;
            color: #3e2723;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        .qr-card-body {
            padding: 1.8rem 1.4rem 1.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #ffffff;
        }

        .qr-callout-pill {
            background: #ffebee;
            color: var(--primary-dark);
            border: 1.5px solid rgba(211, 47, 47, 0.25);
            font-size: 0.84rem;
            font-weight: 800;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Marco del QR con logo central */
        .qr-wrapper {
            position: relative;
            background: #ffffff;
            padding: 1rem;
            border-radius: 20px;
            border: 3px dashed #ffb300;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .qr-image {
            width: 240px;
            height: 240px;
            display: block;
            border-radius: 8px;
        }

        .qr-center-logo {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #ffffff;
            border: 2.5px solid var(--primary);
            padding: 2px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        .qr-instructions {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.35rem;
        }

        .qr-subinstructions {
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.4;
            max-width: 290px;
        }

        .qr-card-footer {
            background: #fff8e1;
            border-top: 1.5px solid #ffe082;
            padding: 0.9rem 1rem;
            font-size: 0.78rem;
            font-weight: 800;
            color: #b71c1c;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        /* ESTILOS DE IMPRESIÓN */
        @media print {
            body {
                background: #ffffff;
                padding: 0;
            }

            .controls-panel {
                display: none !important;
            }

            .qr-card-container {
                box-shadow: none;
                border: 2px solid #ffb300;
                margin: 0 auto;
                max-width: 480px;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <!-- Panel de Configuración y Acciones -->
    <div class="controls-panel">
        <h2 class="controls-title">QR Oficial para Pedidos</h2>
        <div class="url-input-group">
            <label for="url-input">URL de la Carta Digital:</label>
            <input type="text" id="url-input" value="https://carta-micho-burguer.vercel.app/">
        </div>
        <div class="actions-row">
            <button class="btn btn-print" onclick="window.print()">
                🖨️ Imprimir Tarjeta
            </button>
            <button class="btn btn-download" id="download-btn">
                💾 Descargar Imagen
            </button>
            <a href="index.html" class="btn btn-back">
                ⬅️ Volver a la Carta Digital
            </a>
        </div>
    </div>

    <!-- Tarjeta de Exhibición para Imprimir -->
    <div class="qr-card-container" id="qr-card">
        <div class="qr-card-header">
            <img src="LOGOMICHO.png" alt="Micho Burguer Logo" class="qr-card-logo">
            <h1 class="qr-brand-title">MICHO BURGUER</h1>
            <p class="qr-brand-subtitle">EL SABOR QUE TE ENCANTA</p>
        </div>

        <div class="qr-card-body">
            <div class="qr-callout-pill">
                📲 Escanea con tu celular
            </div>

            <div class="qr-wrapper">
                <img id="qr-img" class="qr-image" src="qr_michoburguer.png" alt="Código QR Micho Burguer">
                <img src="LOGOMICHO.png" alt="Logo" class="qr-center-logo">
            </div>

            <div class="qr-instructions">
                ¡Pide directo a la plancha!
            </div>
            <div class="qr-subinstructions">
                Abre la cámara de tu celular, enfoca el código QR y arma tu comanda al instante.
            </div>
        </div>

        <div class="qr-card-footer">
            🛵 A Enviar (Delivery) &nbsp;•&nbsp; 🛍️ A Recoger en Local
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('url-input');
        const qrImg = document.getElementById('qr-img');
        const downloadBtn = document.getElementById('download-btn');

        // Si la página se abre directamente en el dominio en vivo, usar esa URL automáticamente
        if (window.location.hostname && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
            const currentOrigin = window.location.origin;
            urlInput.value = currentOrigin;
            updateQr();
        }

        urlInput.addEventListener('input', updateQr);

        function updateQr() {
            const url = encodeURIComponent(urlInput.value.trim() || 'https://carta-micho-burguer.vercel.app/');
            const newQrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${url}&color=1a1a1a&bgcolor=ffffff&margin=10`;
            qrImg.src = newQrSrc;
        }

        // Descarga del archivo PNG
        downloadBtn.addEventListener('click', async () => {
            const currentSrc = qrImg.src;
            try {
                const response = await fetch(currentSrc);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = 'QR_Micho_Burguer.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (e) {
                // Alternativa directa si hay bloqueo CORS del fetch
                window.open(currentSrc, '_blank');
            }
        });
    </script>
</body>
</html>
