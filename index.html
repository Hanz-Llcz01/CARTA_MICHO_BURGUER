<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micho Burguer - Pedidos Online</title>
    <meta name="description" content="Haz tu pedido online en Micho Burguer. El sabor que te encanta.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <h1 class="brand-name">MICHO<span class="highlight">BURGUER</span></h1>
            <p class="brand-slogan">SABOR QUE TE ENCANTA</p>
        </div>
    </header>

    <main class="container">
        <nav class="category-nav" id="category-nav">
            <!-- Categories will be injected here -->
        </nav>

        <section class="menu-section" id="menu-section">
            <!-- Products will be injected here -->
        </section>
    </main>

    <div class="cart-overlay" id="cart-overlay"></div>
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be injected here -->
            <div class="empty-cart-msg">Tu carrito está vacío</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">S/ 0.00</span>
            </div>
            <button class="checkout-btn" id="checkout-btn" disabled>Confirmar Pedido</button>
        </div>
    </aside>

    <button class="floating-cart-btn" id="floating-cart-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span class="cart-badge" id="cart-badge">0</span>
    </button>

    <!-- Modal for Order Success/API Simulation -->
    <div class="modal" id="success-modal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <h2>¡Pedido Registrado!</h2>
            <p>Tu orden ha sido enviada al sistema.</p>
            <p class="sub-text">En la vida real, aquí es donde nos conectaríamos a la API de Loyverse para que aparezca en tu celular y lo imprimas.</p>
            <button class="primary-btn" id="close-modal-btn">Entendido</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
